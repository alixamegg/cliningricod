<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my student profile</title>
    <script src="https://cdn.tailwindcss.com"></script> 
</head>
<body class="bg-pink-50 min-h-screen">
  <div class="max-w-4xl mx-auto py-10 px-4">
    <div class="grid md:grid-cols-2 gap-6">

   <div class="p-6 bg-pink-100 border border-pink-200 rounded-lg shadow-md">
    <h1 class="text-3xl font-bold text-center text-pink-600">megaa</h1>
    <img src="donat.jpeg" alt="profile picture" class="mx-auto my-4 rounded-full w-32 h-32 object-cover">

    <h2 class="text-lg font-semibold mt-6 mb-3 text-pink-400">About Me</h2>
    <p class="text-gray-600">Hi, I'm a web developer passionate about building clear user interfaces.</p>

    <h2 class="text-lg font-semibold mt-6 mb-3 text-pink-400">My Hobbies</h2>
    <div class="flex gap-3">
        <span class="bg-pink-300 text-black px-3 py-1 rounded-md">coding</span>
        <span class="bg-pink-300 text-black px-3 py-1 rounded-md">photography</span>
        <span class="bg-pink-300 text-black px-3 py-1 rounded-md">gaming</span>
    </div>

    <h2 class="text-lg font-semibold mt-6 mb-3 text-pink-400">weekly schedule</h2>
    <table class="w-full border border-pink-200">
        <tr class="bg-pink-200 text-white">
            <th class="p-2 border-pink-400">Day</th>
            <th class="p-2 border-pink-400">Subject</th>
        </tr>
        <tr>
            <td class="p-2 border-pink-400">Monday</td>
            <td class="p-2 border-pink-400">web development class</td>
        </tr>
        <tr>
            <td class="p-2 border-pink-400">Tuesday</td>
            <td class="p-2 border-pink-400">Photography club</td>
        </tr>
    </table>
  </div>

  <!-- contact form -->
     <div class="w-[450px] mx-auto p-6 bg-pink border border-pink-280 rounded-1g shadow-sm my-10">

       <h2 class="text-xl font-bold text-center text-pink-600 mb-2 ">get in touch</h2>

       <form class="mt-4 space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium text-pink-600">Name:</label>
            <input type="text" id="name" class="w-full mt-1 p-2 border border-pink-300 rounded-md focus:outline-none focus:ring focus:ring-pink-200"">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-pink-600">Email:</label>
            <input type="email" id="email" class="w-full mt-1 p-2 border border-pink-300 rounded-md focus:outline-none focus:ring focus:ring-pink-200">
        </div>
        <div>
            <label for="message" class="block text-sm font-medium text-pink-600">Message:</label>
            <textarea id="message" class="w-full mt-1 p-2 border border-pink-300 rounded-md focus:outline-none focus:ring focus:ring-pink-200"></textarea>
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-pink-600 text-white rounded-md hover-bgpink-700 font-medium transition-colors">send</button>
    </form>
     </div>

</body>
</html>
