<!DOCTYPE html>
<html>
<head>
    <title>Form Sederhana</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-100 p-8">

    <div class="bg-white p-6 rounded-lg max-w-md mx-auto">

        <h1 class="text-2xl font-bold text-pink-600 text-center mb-6">
            Form Data Diri
        </h1>

        <form>

            <!-- Nama -->
            <label class="text-pink-700 font-semibold">Nama:</label>
            <input type="text" value=""
                class="border border-pink-300 p-2 rounded w-full">

            <br>

            <!-- Email -->
            <label class="text-pink-700 font-semibold">Email:</label>
            <input type="email" value=""
                class="border border-pink-300 p-2 rounded w-full">

            <br>

            <!-- Tanggal -->
            <label class="text-pink-700 font-semibold">Tanggal lahir:</label>
            <input type="date" value=""
                class="border border-pink-300 p-2 rounded w-full">

            <br>

            <!-- Radio button -->
            <label class="text-pink-700 font-semibold">Jenis kelamin:</label>

            <div class="mt-2">
                <input type="radio" name="gender" checked>
                Laki-laki

                <input type="radio" name="gender" class="ml-4">
                Perempuan
            </div>

            <br>

            <!-- Pilihan -->
            <label class="text-pink-700 font-semibold">Kelas:</label>

            <select class="border border-pink-300 p-2 rounded w-full">
                <option>X.1</option>
                <option>x.2</option>
                <option>XI.1</option>
                <option>XI.2</option>
            </select>

            <br>

            <!-- Textarea -->
            <label class="text-pink-700 font-semibold">Pesan:</label>

            <textarea rows="4" cols="30"
                class="border border-pink-300 p-2 rounded w-full"></textarea>

            <br><br>

            <!-- Button -->
            <button class="bg-pink-500 text-white px-5 py-2 rounded hover:bg-pink-600">
                Kirim
            </button>

        </form>

    </div>

</body>
</html>
